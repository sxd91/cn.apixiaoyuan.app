[versions]
agp = "9.3.1"
kotlin = "2.4.10"
compose-bom = "2026.08.00"
compose-material3 = "1.5.0-alpha26"
activity = "1.13.0"
androidx-core-ktx = "1.19.0"
lifecycle-runtime = "2.11.0"
miuix = "0.9.4-rc01"
materialkolor = "5.0.0"
serialization = "1.11.0"
navigation-compose = "2.9.0"
room = "2.8.0"
ksp = "2.4.10-2.0.4"
okhttp = "5.1.0"
retrofit = "3.0.0"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle-runtime" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-runtime" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur-android", version.ref = "miuix" }
miuix-shader = { module = "top.yukonga.miuix.kmp:miuix-shader-android", version.ref = "miuix" }
miuix-nav = { module = "top.yukonga.miuix.kmp:miuix-nav-android", version.ref = "miuix" }
# Material Symbols 图标：这套库把图标注册成 androidx Icons.Outlined 上的扩展属性，
# 用法与 cn.nizou.sxd 一致。filled 变体（icons-material-symbols-outlined-filled-cmp）
# 暂不引入——本地缓存无该产物、包结构未经解包验证，AppIcons 先统一复用 outlined。
materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialkolor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
# Room 与 KSP 暂不启用：当前工程无 @Entity/@Dao，注解处理器空转；
# 且 KSP 2.4.10-2.0.4 在镜像与本地仓库的可用性未经确认。数据层开写时一并加回。
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# kotlin-android 保留条目但 app 模块已不再 alias：AGP 9 起 Kotlin 由内置 KGP 接管，
# 显式应用该插件会直接报 "no longer required for Kotlin support since AGP 9.0"。
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
