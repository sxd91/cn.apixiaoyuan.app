name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  build:
    name: Build (unsigned)
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release (unsigned)
        run: |
          set -euo pipefail
          VC=$(grep -oP '^versionCode=\K\d+' version.properties | head -1)
          VN=$(grep -oP '^versionName=\K.*' version.properties | head -1)
          echo "Building $VN (code $VC) — CI 不改版本号"
          ./gradlew assembleRelease --no-daemon -PversionCode="$VC" -PversionName="$VN"

      - name: Collect APKs + ABI check + mapping
        run: |
          set -euo pipefail
          mkdir -p dist/apk dist/mapping
          for apk in app/build/outputs/apk/release/*.apk; do
            test -f "$apk"
            echo "::group::$apk"
            echo "ABIs:"
            unzip -Z1 "$apk" 'lib/*/*.so' | cut -d/ -f2 | sort -u || true
            echo "::endgroup::"
            cp -v "$apk" dist/apk/
          done
          find app/build/outputs/mapping -name mapping.txt -print0 | while IFS= read -r -d '' m; do
            variantDir=$(basename "$(dirname "$m")")
            cp -v "$m" "dist/mapping/mapping-${variantDir}.txt"
          done || true
          echo "Collected APKs:"; ls -1 dist/apk
          echo "Collected mappings:"; ls -1 dist/mapping || echo "(none)"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: 逆向系老挂-unsigned
          path: dist/apk/*.apk

      - name: Upload obfuscation mapping
        uses: actions/upload-artifact@v4
        with:
          name: obfuscation-mapping
          path: dist/mapping/*.txt
